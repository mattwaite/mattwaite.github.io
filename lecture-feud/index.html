<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecture Feud</title>
<style>
  :root{
    --navy-dark:#0a1958;
    --navy:#132a7a;
    --navy-light:#1e42b0;
    --gold:#ffcc33;
    --gold-dark:#c99a1f;
    --red:#d92b2b;
    --blue-team:#2277dd;
    --red-team:#dd3344;
    --panel-bg:#0d1440;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:radial-gradient(ellipse at center, #050a2e 0%, #01031a 100%);
    font-family:'Arial Black','Arial',sans-serif;
    color:#fff;
    overflow-x:hidden;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;}

  h1.title{
    font-size:clamp(22px,4vw,40px);
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold);
    text-shadow:0 0 12px rgba(255,204,51,0.5), 2px 2px 0 #000;
    margin:6px 0 18px;
    text-align:center;
  }

  /* ---------- SETUP SCREEN ---------- */
  .setup-card{
    background:var(--panel-bg);
    border:3px solid var(--gold-dark);
    border-radius:16px;
    padding:24px;
    max-width:820px;
    width:100%;
    box-shadow:0 0 40px rgba(0,0,0,0.6);
  }
  .field-row{margin-bottom:16px;}
  label{
    display:block;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#aebbe8;
    margin-bottom:6px;
    font-family:Arial,sans-serif;
    font-weight:bold;
  }
  input[type="text"], input[type="number"]{
    width:100%;
    padding:10px 12px;
    border-radius:8px;
    border:2px solid #35468f;
    background:#16205c;
    color:#fff;
    font-size:16px;
    font-family:Arial,sans-serif;
  }
  input[type="text"]:focus, input[type="number"]:focus{outline:2px solid var(--gold);}

  .team-names{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:8px;}

  .answers-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
  .answer-row{
    display:grid;
    grid-template-columns:36px 1fr 110px 40px;
    gap:8px;
    align-items:center;
  }
  .answer-row .rownum{
    color:var(--gold);
    font-family:Arial,sans-serif;
    font-weight:bold;
    text-align:center;
  }
  .btn{
    cursor:pointer;
    border:none;
    border-radius:8px;
    font-family:Arial,sans-serif;
    font-weight:bold;
    font-size:14px;
    padding:10px 16px;
    transition:transform .08s ease, filter .15s ease;
  }
  .btn:hover{filter:brightness(1.12);}
  .btn:active{transform:scale(0.96);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;}
  .btn-gold{background:linear-gradient(180deg,#ffe066,var(--gold-dark));color:#231a00;}
  .btn-blue{background:linear-gradient(180deg,#3d6dff,#173aa0);color:#fff;}
  .btn-red{background:linear-gradient(180deg,#ff5b5b,#a01818);color:#fff;}
  .btn-ghost{background:#222c66;color:#cfd8ff;}
  .btn-remove{
    background:#3a1f1f;color:#ff8a8a;border-radius:8px;border:none;
    font-size:18px;line-height:1;cursor:pointer;padding:6px 10px;
  }
  .setup-actions{display:flex;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap;}

  /* ---------- GAME SCREEN ---------- */
  #game-screen{width:100%;max-width:1200px;display:flex;flex-direction:column;align-items:center;}
  .question-banner{
    background:linear-gradient(180deg,var(--navy-light),var(--navy-dark));
    border:3px solid var(--gold);
    border-radius:14px;
    padding:16px 28px;
    font-size:clamp(18px,2.6vw,28px);
    text-align:center;
    max-width:960px;
    width:100%;
    margin-bottom:18px;
    box-shadow:0 0 30px rgba(255,204,51,0.15);
  }

  .game-layout{
    display:grid;
    grid-template-columns:200px 1fr 200px;
    gap:18px;
    width:100%;
    align-items:start;
  }
  @media (max-width:820px){
    .game-layout{grid-template-columns:1fr;}
    .team-panel{order:2;}
    .board-wrap{order:1;}
  }

  .team-panel{
    border-radius:14px;
    padding:16px 12px;
    text-align:center;
    border:3px solid transparent;
    background:var(--panel-bg);
    transition:box-shadow .3s, border-color .3s;
  }
  .team-panel.controlA{border-color:var(--blue-team);box-shadow:0 0 24px rgba(34,119,221,0.7);}
  .team-panel.controlB{border-color:var(--red-team);box-shadow:0 0 24px rgba(221,51,68,0.7);}
  .team-panel .team-name-display{
    font-size:15px;text-transform:uppercase;letter-spacing:1px;color:#cfd8ff;margin-bottom:4px;
    font-family:Arial,sans-serif;font-weight:bold;
  }
  .team-panel .team-score{
    font-size:clamp(32px,5vw,48px);color:var(--gold);text-shadow:2px 2px 0 #000;
  }
  .control-tag{
    margin-top:8px;font-size:12px;font-family:Arial,sans-serif;font-weight:bold;
    text-transform:uppercase;letter-spacing:1px;color:var(--gold);
    visibility:hidden;
  }
  .team-panel.controlA .control-tag, .team-panel.controlB .control-tag{visibility:visible;}
  .team-panel button{width:100%;margin-top:10px;}

  .board-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .board{
    display:flex;flex-direction:column;gap:10px;width:100%;max-width:640px;
  }
  .answer-tile{
    perspective:800px;
    height:56px;
  }
  .tile-inner{
    position:relative;width:100%;height:100%;
    transition:transform .5s cubic-bezier(.2,.8,.3,1.1);
    transform-style:preserve-3d;
  }
  .answer-tile.revealed .tile-inner{transform:rotateX(180deg);}
  .tile-face{
    position:absolute;inset:0;
    border-radius:10px;
    display:flex;align-items:center;
    backface-visibility:hidden;
    border:2px solid var(--gold-dark);
  }
  .tile-front{
    background:linear-gradient(180deg,var(--navy-light),var(--navy));
    justify-content:center;
    cursor:pointer;
  }
  .tile-front:hover{filter:brightness(1.2);}
  .tile-front .num-badge{
    width:34px;height:34px;border-radius:50%;
    background:var(--gold);color:#231a00;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;font-family:Arial,sans-serif;
  }
  .tile-back{
    background:linear-gradient(180deg,#fff6da,#ffe066);
    color:#1a1200;
    transform:rotateX(180deg);
    padding:0 18px;
    justify-content:space-between;
  }
  .tile-back .ans-text{font-size:clamp(15px,2.2vw,20px);font-family:Arial,sans-serif;font-weight:bold;text-transform:uppercase;}
  .tile-back .ans-points{
    background:var(--navy-dark);color:var(--gold);
    border-radius:8px;padding:6px 14px;font-size:18px;min-width:44px;text-align:center;
  }

  .pot-strip{
    display:flex;align-items:center;gap:18px;
    background:var(--panel-bg);border:2px solid var(--gold-dark);border-radius:12px;
    padding:12px 20px;flex-wrap:wrap;justify-content:center;
  }
  .pot-value{font-size:26px;color:var(--gold);}
  .pot-label{font-size:12px;font-family:Arial,sans-serif;color:#aebbe8;text-transform:uppercase;letter-spacing:1px;}
  .strikes-box{display:flex;gap:6px;}
  .strike-x{
    width:34px;height:34px;border-radius:6px;border:2px solid #5a2020;
    display:flex;align-items:center;justify-content:center;font-size:22px;color:#5a2020;
    background:#1a0d0d;font-family:Arial,sans-serif;font-weight:bold;
  }
  .strike-x.filled{color:#ff3b3b;border-color:#ff3b3b;background:#3a0d0d;text-shadow:0 0 10px #ff3b3b;}

  .steal-banner{
    background:var(--red);color:#fff;font-size:20px;padding:10px 22px;border-radius:10px;
    letter-spacing:2px;text-transform:uppercase;animation:pulse 1s infinite;
    text-align:center;
  }
  @keyframes pulse{0%{opacity:1;}50%{opacity:.55;}100%{opacity:1;}}

  .game-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px;}

  .footer-note{margin-top:24px;font-size:11px;color:#5a6aa8;font-family:Arial,sans-serif;text-align:center;}
</style>
</head>
<body>
<div id="app">
  <h1 class="title">🎙️ Lecture Feud</h1>

  <!-- ================= SETUP SCREEN ================= -->
  <div id="setup-screen" class="setup-card">
    <div class="team-names">
      <div class="field-row">
        <label>Team A Name</label>
        <input type="text" id="teamAName" placeholder="Team A">
      </div>
      <div class="field-row">
        <label>Team B Name</label>
        <input type="text" id="teamBName" placeholder="Team B">
      </div>
    </div>

    <div class="field-row">
      <label>Question</label>
      <input type="text" id="questionInput" placeholder="e.g. Name something you'd bring to a desert island">
    </div>

    <div class="field-row">
      <label>Top Answers (text + survey points, highest first not required — it will sort automatically)</label>
      <div class="answers-list" id="answersList"></div>
      <button class="btn btn-ghost" id="addAnswerBtn" type="button">+ Add Answer</button>
    </div>

    <div class="setup-actions">
      <button class="btn btn-red" id="resetGameBtn" type="button">Reset Whole Game</button>
      <button class="btn btn-gold" id="createBoardBtn" type="button">Create Board ▶</button>
    </div>
  </div>

  <!-- ================= GAME SCREEN ================= -->
  <div id="game-screen" style="display:none;">
    <div class="question-banner" id="questionBanner"></div>

    <div class="game-layout">
      <div class="team-panel" id="teamPanelA">
        <div class="team-name-display" id="teamADisplay">TEAM A</div>
        <div class="team-score" id="teamAScore">0</div>
        <div class="control-tag">● IN CONTROL</div>
        <button class="btn btn-blue" id="controlABtn" type="button">Give Control</button>
        <button class="btn btn-gold" id="awardABtn" type="button">Award Pot</button>
      </div>

      <div class="board-wrap">
        <div class="board" id="board"></div>

        <div class="pot-strip">
          <div>
            <div class="pot-label">Pot</div>
            <div class="pot-value" id="potValue">0</div>
          </div>
          <div class="strikes-box" id="strikesBox">
            <div class="strike-x">✕</div>
            <div class="strike-x">✕</div>
            <div class="strike-x">✕</div>
          </div>
          <button class="btn btn-red" id="strikeBtn" type="button">Strike!</button>
        </div>

        <div id="stealBanner" class="steal-banner" style="display:none;">⚡ Steal Chance! ⚡</div>

        <div class="game-actions">
          <button class="btn btn-ghost" id="editBoardBtn" type="button">Edit This Board</button>
          <button class="btn btn-ghost" id="newQuestionBtn" type="button">New Question</button>
          <button class="btn btn-ghost" id="fullscreenBtn" type="button">Fullscreen</button>
        </div>
      </div>

      <div class="team-panel" id="teamPanelB">
        <div class="team-name-display" id="teamBDisplay">TEAM B</div>
        <div class="team-score" id="teamBScore">0</div>
        <div class="control-tag">● IN CONTROL</div>
        <button class="btn btn-red" id="controlBBtn" type="button">Give Control</button>
        <button class="btn btn-gold" id="awardBBtn" type="button">Award Pot</button>
      </div>
    </div>
  </div>

  <div class="footer-note">State autosaves in this browser. "Reset Whole Game" clears scores and boards.</div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "lectureFeudState_v1";

  var state = {
    teamA: { name: "Team A", score: 0 },
    teamB: { name: "Team B", score: 0 },
    control: "A",
    strikes: 0,
    pot: 0,
    stealMode: false,
    board: null // { question: "", answers: [{text, points, revealed}] }
  };

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }
  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && typeof parsed === "object") state = Object.assign(state, parsed);
      }
    }catch(e){}
  }

  // ---------------- AUDIO (synthesized, no external files) ----------------
  var audioCtx = null;
  function ctx(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function tone(freq, start, dur, type, gainPeak){
    var c = ctx();
    var osc = c.createOscillator();
    var gain = c.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, c.currentTime + start);
    gain.gain.linearRampToValueAtTime(gainPeak || 0.3, c.currentTime + start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + start + dur);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(c.currentTime + start);
    osc.stop(c.currentTime + start + dur + 0.05);
  }
  function playDing(){
    try{
      tone(1046.5, 0, 0.35, "sine", 0.35);   // C6
      tone(1318.5, 0.09, 0.45, "sine", 0.3); // E6
      tone(1568.0, 0.18, 0.6, "sine", 0.25); // G6
    }catch(e){}
  }
  function playBuzz(){
    try{
      var c = ctx();
      var osc = c.createOscillator();
      var gain = c.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(140, c.currentTime);
      osc.frequency.linearRampToValueAtTime(70, c.currentTime + 0.55);
      gain.gain.setValueAtTime(0.35, c.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.6);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start();
      osc.stop(c.currentTime + 0.65);
    }catch(e){}
  }
  function playSteal(){
    try{
      tone(220, 0, 0.25, "square", 0.25);
      tone(180, 0.2, 0.35, "square", 0.25);
    }catch(e){}
  }

  // ---------------- DOM refs ----------------
  var setupScreen = document.getElementById("setup-screen");
  var gameScreen = document.getElementById("game-screen");
  var teamAName = document.getElementById("teamAName");
  var teamBName = document.getElementById("teamBName");
  var questionInput = document.getElementById("questionInput");
  var answersList = document.getElementById("answersList");
  var addAnswerBtn = document.getElementById("addAnswerBtn");
  var createBoardBtn = document.getElementById("createBoardBtn");
  var resetGameBtn = document.getElementById("resetGameBtn");

  var questionBanner = document.getElementById("questionBanner");
  var board = document.getElementById("board");
  var potValue = document.getElementById("potValue");
  var strikesBox = document.getElementById("strikesBox");
  var strikeBtn = document.getElementById("strikeBtn");
  var stealBanner = document.getElementById("stealBanner");
  var teamPanelA = document.getElementById("teamPanelA");
  var teamPanelB = document.getElementById("teamPanelB");
  var teamADisplay = document.getElementById("teamADisplay");
  var teamBDisplay = document.getElementById("teamBDisplay");
  var teamAScoreEl = document.getElementById("teamAScore");
  var teamBScoreEl = document.getElementById("teamBScore");
  var controlABtn = document.getElementById("controlABtn");
  var controlBBtn = document.getElementById("controlBBtn");
  var awardABtn = document.getElementById("awardABtn");
  var awardBBtn = document.getElementById("awardBBtn");
  var editBoardBtn = document.getElementById("editBoardBtn");
  var newQuestionBtn = document.getElementById("newQuestionBtn");
  var fullscreenBtn = document.getElementById("fullscreenBtn");

  // ---------------- Setup screen: answer rows ----------------
  function addAnswerRow(text, points){
    var row = document.createElement("div");
    row.className = "answer-row";

    var num = document.createElement("div");
    num.className = "rownum";
    row.appendChild(num);

    var textInput = document.createElement("input");
    textInput.type = "text";
    textInput.placeholder = "Answer text";
    textInput.value = text || "";
    row.appendChild(textInput);

    var pointsInput = document.createElement("input");
    pointsInput.type = "number";
    pointsInput.placeholder = "Points";
    pointsInput.min = "0";
    pointsInput.value = (points === undefined || points === null) ? "" : points;
    row.appendChild(pointsInput);

    var removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.className = "btn-remove";
    removeBtn.textContent = "✕";
    removeBtn.addEventListener("click", function(){
      row.remove();
      renumberRows();
    });
    row.appendChild(removeBtn);

    answersList.appendChild(row);
    renumberRows();
  }
  function renumberRows(){
    var rows = answersList.querySelectorAll(".answer-row");
    rows.forEach(function(r, i){
      r.querySelector(".rownum").textContent = (i+1) + ".";
    });
  }
  function getAnswerRowsData(){
    var rows = answersList.querySelectorAll(".answer-row");
    var data = [];
    rows.forEach(function(r){
      var inputs = r.querySelectorAll("input");
      var text = inputs[0].value.trim();
      var pts = parseInt(inputs[1].value, 10);
      if(text.length > 0){
        data.push({ text: text, points: isNaN(pts) ? 0 : pts, revealed: false });
      }
    });
    return data;
  }

  addAnswerBtn.addEventListener("click", function(){ addAnswerRow("", ""); });

  function populateSetupFromState(prefillBoard){
    teamAName.value = state.teamA.name;
    teamBName.value = state.teamB.name;
    answersList.innerHTML = "";
    if(prefillBoard && state.board){
      questionInput.value = state.board.question;
      state.board.answers.forEach(function(a){ addAnswerRow(a.text, a.points); });
    } else {
      questionInput.value = "";
      for(var i=0;i<4;i++) addAnswerRow("", "");
    }
  }

  createBoardBtn.addEventListener("click", function(){
    var q = questionInput.value.trim();
    var answers = getAnswerRowsData();
    if(!q){ alert("Please enter a question."); return; }
    if(answers.length === 0){ alert("Please add at least one answer."); return; }

    state.teamA.name = teamAName.value.trim() || "Team A";
    state.teamB.name = teamBName.value.trim() || "Team B";

    answers.sort(function(a,b){ return b.points - a.points; });

    state.board = { question: q, answers: answers };
    state.pot = 0;
    state.strikes = 0;
    state.stealMode = false;
    save();
    showGameScreen();
  });

  resetGameBtn.addEventListener("click", function(){
    if(confirm("Reset the whole game? This clears both team scores and the current board.")){
      state = {
        teamA: { name: teamAName.value.trim() || "Team A", score: 0 },
        teamB: { name: teamBName.value.trim() || "Team B", score: 0 },
        control: "A",
        strikes: 0,
        pot: 0,
        stealMode: false,
        board: null
      };
      save();
      populateSetupFromState(false);
    }
  });

  // ---------------- Game screen ----------------
  function showGameScreen(){
    setupScreen.style.display = "none";
    gameScreen.style.display = "block";
    renderGame();
  }
  function showSetupScreen(prefillBoard){
    gameScreen.style.display = "none";
    setupScreen.style.display = "block";
    populateSetupFromState(prefillBoard);
  }

  function renderGame(){
    if(!state.board) return;
    questionBanner.textContent = state.board.question;
    teamADisplay.textContent = state.teamA.name.toUpperCase();
    teamBDisplay.textContent = state.teamB.name.toUpperCase();
    teamAScoreEl.textContent = state.teamA.score;
    teamBScoreEl.textContent = state.teamB.score;
    potValue.textContent = state.pot;

    teamPanelA.classList.toggle("controlA", state.control === "A");
    teamPanelB.classList.toggle("controlB", state.control === "B");

    var strikeEls = strikesBox.querySelectorAll(".strike-x");
    strikeEls.forEach(function(el, i){
      el.classList.toggle("filled", i < state.strikes);
    });

    stealBanner.style.display = state.stealMode ? "block" : "none";

    board.innerHTML = "";
    state.board.answers.forEach(function(a, idx){
      var tile = document.createElement("div");
      tile.className = "answer-tile" + (a.revealed ? " revealed" : "");

      var inner = document.createElement("div");
      inner.className = "tile-inner";

      var front = document.createElement("div");
      front.className = "tile-face tile-front";
      var badge = document.createElement("div");
      badge.className = "num-badge";
      badge.textContent = (idx+1);
      front.appendChild(badge);
      front.addEventListener("click", function(){ revealAnswer(idx); });

      var back = document.createElement("div");
      back.className = "tile-face tile-back";
      var txt = document.createElement("div");
      txt.className = "ans-text";
      txt.textContent = a.text;
      var pts = document.createElement("div");
      pts.className = "ans-points";
      pts.textContent = a.points;
      back.appendChild(txt);
      back.appendChild(pts);

      inner.appendChild(front);
      inner.appendChild(back);
      tile.appendChild(inner);
      board.appendChild(tile);
    });
  }

  function revealAnswer(idx){
    var a = state.board.answers[idx];
    if(a.revealed) return;
    a.revealed = true;
    state.pot += a.points;
    state.stealMode = false;
    playDing();
    save();
    renderGame();
  }

  strikeBtn.addEventListener("click", function(){
    if(state.strikes >= 3) return;
    state.strikes += 1;
    playBuzz();
    if(state.strikes >= 3){
      state.control = state.control === "A" ? "B" : "A";
      state.strikes = 0;
      state.stealMode = true;
      setTimeout(playSteal, 500);
    }
    save();
    renderGame();
  });

  controlABtn.addEventListener("click", function(){
    state.control = "A"; state.strikes = 0; state.stealMode = false; save(); renderGame();
  });
  controlBBtn.addEventListener("click", function(){
    state.control = "B"; state.strikes = 0; state.stealMode = false; save(); renderGame();
  });

  awardABtn.addEventListener("click", function(){
    if(state.pot <= 0) return;
    state.teamA.score += state.pot;
    state.pot = 0;
    state.strikes = 0;
    state.stealMode = false;
    save();
    renderGame();
  });
  awardBBtn.addEventListener("click", function(){
    if(state.pot <= 0) return;
    state.teamB.score += state.pot;
    state.pot = 0;
    state.strikes = 0;
    state.stealMode = false;
    save();
    renderGame();
  });

  editBoardBtn.addEventListener("click", function(){ showSetupScreen(true); });
  newQuestionBtn.addEventListener("click", function(){
    state.board = null;
    state.pot = 0;
    state.strikes = 0;
    state.stealMode = false;
    save();
    showSetupScreen(false);
  });

  fullscreenBtn.addEventListener("click", function(){
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(function(){});
    } else {
      document.exitFullscreen();
    }
  });

  // ---------------- init ----------------
  load();
  if(state.board){
    showGameScreen();
  } else {
    populateSetupFromState(false);
  }
})();
</script>
</body>
</html>
